exclude: '.*(versioneer\.py|_version\.py).*'

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 'v0.16.7'
    hooks:
       # Run the linter.
       - id: ruff-check
       # Run the formatter.
       - id: ruff-format

# Mypy
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: 'v2.3.1'
    hooks:
    - id: mypy
      name: mypy
      additional_dependencies: [types-PyYAML==6.0.12.20240808, types-python-dateutil]