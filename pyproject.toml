[project]
name = "med-diagnostics"
authors = [
    { name = "ACCESS-NRI" },
]
description = "ACCESS MED-Diagnostics"
readme = "README.rst"
requires-python = ">=3.10"
license = {text = "APACHE-2.0"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
dependencies = ["access-nri-intake", "panel", "matplotlib", "nc-time-axis", "hvplot", "datashader"]
dynamic = ["version"]

[project.optional-dependencies]
docs = ["mkdocs-git-revision-date-localized-plugin==1.6.0", "mkdocs-bibtex==4.4.0", "mkdocs-include-markdown-plugin==7.3.0", "mkdocs-macros-plugin==1.3.7", "mkdocs-redirects==1.2.2", "mkdocstrings-python>=2.0.9,<3", "mkdocs-resolve-absolute-urls-plugin @ git+https://github.com/ACCESS-NRI/mkdocs_resolve_absolute_urls_plugin.git@2.0.0"]

[build-system]
build-backend = "setuptools.build_meta"
requires = [
  "setuptools >= 61.0.0",
  "versioneer[toml]",
]


[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
med_diagnostics = ["master_map.csv"]

[tool.versioneer]
VCS = "git"
style = "pep440"
versionfile_source = "src/med_diagnostics/_version.py"
versionfile_build = "med_diagnostics/_version.py"
tag_prefix = "v"
parentdir_prefix = "med_diagnostics-"

[tool.pixi.workspace]
channels = ["conda-forge", "accessnri"]
platforms = ["osx-arm64", "linux-64", "win-64"]

[tool.pixi.pypi-dependencies]
med-diagnostics = { path = ".", editable = true, extras = ["docs"] }

[tool.pixi.tasks]
test-cov = "pytest --cov=med_diagnostics --cov-report=xml -W ignore"

[tool.coverage.run]
core = "sysmon"

[tool.pixi.dependencies]
pytest = ">=9.1.1,<10"
hvplot = ">=0.12.2,<0.13"
access-nri-intake = ">=1.7.0,<2"
pytest-cov = ">=7.1.0,<8"
nc-time-axis = ">=1.4.1,<2"
versioneer = ">=0.29,<0.30"
pre-commit = ">=4.6.2,<5"
ruff = ">=0.16.7,<0.17"
datashader = ">=0.19.1,<0.20"
cartopy = ">=0.26.0,<0.27"
xclim = ">=0.62.0,<0.63"
python = ">=3.11,<3.14"
mkdocs = ">=1.6.1,<2"
mkdocs-material = ">=9.7.7,<10"
mkdocs-jupyter = ">=0.26.3,<0.27"
mkdocstrings = ">=1.0.6,<2"

[tool.mypy]
exclude = [
    "versioneer\\.py",
    "_version\\.py"
]

[tool.ruff]
exclude = [
    "versioneer.py",
    "_version.py"
]
