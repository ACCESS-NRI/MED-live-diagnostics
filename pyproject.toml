[project]
name = "med-diagnostics"
authors = [
    { name = "ACCESS-NRI" },
]
description = "ACCESS MED-Diagnostics"
readme = "README.rst"
requires-python = ">=3.10"
license = {text = "APACHE-2.0"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
dependencies = ["apscheduler", "access-nri-intake", "panel", "matplotlib", "nc-time-axis", "hvplot", "datashader"]
dynamic = ["version"]

[build-system]
build-backend = "setuptools.build_meta"
requires = [
  "setuptools >= 61.0.0",
  "versioneer[toml]",
]


[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
med_diagnostics = ["master_map.csv"]

[tool.versioneer]
VCS = "git"
style = "pep440"
versionfile_source = "src/med_diagnostics/_version.py"
versionfile_build = "med_diagnostics/_version.py"
tag_prefix = "v"
parentdir_prefix = "med_diagnostics-"

[tool.pixi.workspace]
channels = ["conda-forge", "accessnri"]
platforms = ["osx-arm64", "linux-64", "win-64"]

[tool.pixi.pypi-dependencies]
med-diagnostics = { path = ".", editable = true }

[tool.pixi.tasks]
test-cov = "pytest --cov=med_diagnostics --cov-report=xml"

[tool.pixi.dependencies]
pytest = ">=9.1.1,<10"
hvplot = ">=0.12.2,<0.13"
access-nri-intake = ">=1.7.0,<2"
pytest-cov = ">=7.1.0,<8"
nc-time-axis = ">=1.4.1,<2"
versioneer = ">=0.29,<0.30"
pre-commit = ">=4.6.2,<5"
ruff = ">=0.16.7,<0.17"
datashader = ">=0.19.1,<0.20"
cartopy = ">=0.26.0,<0.27"
xclim = ">=0.62.0,<0.63"

[tool.mypy]
exclude = [
    "versioneer\\.py",
    "_version\\.py"
]

[tool.ruff]
exclude = [
    "versioneer.py",
    "_version.py"
]
